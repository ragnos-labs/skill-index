<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2140" viewBox="0 0 1400 2140" role="img" aria-labelledby="title description">
<title id="title">R2C: Research to Cairns workflow</title>
<desc id="description">The main agent selects research operations and explains findings in chat. When an approved automatic save policy applies and no no-save override is present, one background worker preserves exact L3 originals, approves passing L2 summaries and publishes L1 links. Independent readback determines saved versus pending. No-save requests keep research in chat without source storage or a save worker.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1400" height="2140" fill="#f8fafc"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#142235} .small{font-size:20px;fill:#44566b} .label{font-size:19px;fill:#44566b} .node-title{font-size:25px;font-weight:700} .edge{fill:none;stroke:#64748b;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#arrow)}</style>
<text x="64" y="76" font-size="48" font-weight="700" fill="#142235" text-anchor="start">R2C / Research to Cairns</text>
<text x="64" y="118" font-size="25" font-weight="400" fill="#44566b" text-anchor="start">Research in chat. Verified knowledge in the background.</text>
<rect x="420" y="164" width="560" height="82" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="444" y="202" font-size="25" font-weight="700" fill="#142235" text-anchor="start">Your topic, link or research question</text>
<path class="edge" d="M700 246 V286"/>
<rect x="320" y="286" width="760" height="110" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="344" y="324" font-size="25" font-weight="700" fill="#142235" text-anchor="start">Select the right tool and operation</text>
<text x="344" y="359" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">Exa / Firecrawl + Alexandria / ScrapeCreators / Web</text>
<text x="344" y="388" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">Choose by evidence, freshness, access and cost.</text>
<path class="edge" d="M700 396 V436"/>
<rect x="420" y="436" width="560" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="444" y="474" font-size="25" font-weight="700" fill="#142235" text-anchor="start">Read sources and check the evidence</text>
<text x="444" y="509" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">Preserve provenance; make coverage gaps visible.</text>
<path class="edge" d="M700 524 V552 H309 V634"/>
<path class="edge" d="M700 524 V552 H1040 V616"/>
<text x="64" y="599" font-size="21" font-weight="700" fill="#44566b" text-anchor="start">MAIN AGENT / CHAT</text>
<text x="742" y="586" font-size="21" font-weight="700" fill="#44566b" text-anchor="start">SAVE POLICY + ONE WORKER</text>
<rect x="64" y="634" width="490" height="174" rx="18" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="88" y="672" font-size="25" font-weight="700" fill="#142235" text-anchor="start">TLDR + sourced findings</text>
<text x="88" y="707" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">Use cases, HOW and prerequisites</text>
<text x="88" y="736" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">Stack fit, limitations and recommendations</text>
<text x="88" y="765" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">Keep proposals distinct from evidence.</text>
<rect x="742" y="616" width="596" height="154" rx="18" fill="#fff8e7" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="766" y="654" font-size="25" font-weight="700" fill="#142235" text-anchor="start">Auto-save enabled</text>
<text x="766" y="685" font-size="25" font-weight="700" fill="#142235" text-anchor="start">for this request?</text>
<text x="766" y="720" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">Approved save policy applies.</text>
<text x="766" y="749" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">No-save / read-only overrides it.</text>
<path class="edge" d="M742 693 H630 V842 H535 V862"/>
<text x="555" y="799" font-size="21" font-weight="700" fill="#142235" text-anchor="start">No</text>
<rect x="415" y="862" width="240" height="110" rx="18" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="439" y="900" font-size="25" font-weight="700" fill="#142235" text-anchor="start">Chat only</text>
<text x="439" y="935" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">No source storage</text>
<text x="439" y="964" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">or save worker.</text>
<path class="edge" d="M1040 770 V862"/>
<text x="1060" y="823" font-size="21" font-weight="700" fill="#142235" text-anchor="start">Yes</text>
<rect x="742" y="862" width="596" height="110" rx="18" fill="#eaf7f4" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="766" y="900" font-size="25" font-weight="700" fill="#142235" text-anchor="start">Freeze evidence checkpoints</text>
<text x="766" y="935" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">Originals, URLs, timestamps and hashes.</text>
<text x="766" y="964" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">Start one authorized save worker.</text>
<path class="edge" d="M309 808 V1066"/>
<rect x="64" y="1066" width="490" height="126" rx="18" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="88" y="1104" font-size="25" font-weight="700" fill="#142235" text-anchor="start">Keep working in chat</text>
<text x="88" y="1139" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">With saving enabled, later evidence goes</text>
<text x="88" y="1168" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">as a new checkpoint to the same worker.</text>
<path class="edge" d="M554 1128 H680 V919 H742" stroke-dasharray="7 6"/>
<text x="567" y="1097" font-size="18" font-weight="400" fill="#44566b" text-anchor="start">New evidence</text>
<path class="edge" d="M1040 972 V1066"/>
<rect x="742" y="1066" width="596" height="110" rx="18" fill="#eaf7f4" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="766" y="1104" font-size="25" font-weight="700" fill="#142235" text-anchor="start">L3 / Exact originals</text>
<text x="766" y="1139" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">Preserve bytes, source identity and revision.</text>
<path class="edge" d="M1040 1176 V1228"/>
<rect x="742" y="1228" width="596" height="132" rx="18" fill="#eaf7f4" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="766" y="1266" font-size="25" font-weight="700" fill="#142235" text-anchor="start">L2 / Reviewed summaries</text>
<text x="766" y="1301" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">Check support and completeness.</text>
<text x="766" y="1330" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">Approve only the exact passing cards.</text>
<path class="edge" d="M1040 1360 V1420"/>
<text x="1060" y="1396" font-size="18" font-weight="400" fill="#44566b" text-anchor="start">Pass + approval</text>
<rect x="742" y="1420" width="596" height="110" rx="18" fill="#eaf7f4" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="766" y="1458" font-size="25" font-weight="700" fill="#142235" text-anchor="start">L1 / Index and standing-map links</text>
<text x="766" y="1493" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">Preserve existing facts and unrelated cards.</text>
<path class="edge" d="M742 1294 H660 V1450 H584"/>
<text x="390" y="1365" font-size="19" font-weight="400" fill="#44566b" text-anchor="start">Review fails</text>
<rect x="64" y="1400" width="520" height="132" rx="18" fill="#fff1e8" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="88" y="1438" font-size="25" font-weight="700" fill="#142235" text-anchor="start">Pending, with a checkpoint</text>
<text x="88" y="1473" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">A failed review or unavailable save route</text>
<text x="88" y="1502" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">keeps completed stages and the resume point.</text>
<path class="edge" d="M324 1532 V1600"/>
<path class="edge" d="M1040 1530 V1600"/>
<rect x="300" y="1600" width="950" height="110" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="324" y="1638" font-size="25" font-weight="700" fill="#142235" text-anchor="start">Main agent independently verifies the result</text>
<text x="324" y="1673" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">Read back L3 hashes, exact L2 approvals and both L1 surfaces.</text>
<path class="edge" d="M775 1710 V1750"/>
<rect x="300" y="1750" width="950" height="90" rx="18" fill="#fff8e7" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="324" y="1788" font-size="25" font-weight="700" fill="#142235" text-anchor="start">All required L1-L3 checks pass?</text>
<text x="324" y="1823" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">An upload, dispatch or exit code alone is not completion.</text>
<path class="edge" d="M1000 1840 V1900"/>
<text x="1020" y="1881" font-size="21" font-weight="700" fill="#142235" text-anchor="start">Yes</text>
<path class="edge" d="M520 1840 V1866 H354 V1900"/>
<text x="377" y="1891" font-size="21" font-weight="700" fill="#142235" text-anchor="start">No</text>
<rect x="770" y="1900" width="480" height="100" rx="18" fill="#e5f5e9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="794" y="1938" font-size="25" font-weight="700" fill="#142235" text-anchor="start">Saved to Cairns L1-L3</text>
<text x="794" y="1973" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">Verified originals, cards and readable links.</text>
<rect x="64" y="1900" width="580" height="100" rx="18" fill="#fff1e8" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="88" y="1938" font-size="25" font-weight="700" fill="#142235" text-anchor="start">Pending / resume the missing step</text>
<text x="88" y="1973" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">Report what completed and what remains.</text>
<text x="64" y="2070" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">Each installation supplies its own save policy, destination and permissions.</text>
<text x="64" y="2103" font-size="21" font-weight="400" fill="#44566b" text-anchor="start">Closing the chat does not guarantee continued work without an approved durable executor.</text>
</svg>
